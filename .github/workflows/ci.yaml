# ✍️ Description:
# This workflow runs continuous integration checks on pull requests.
# It performs code formatting checks, linting, and type checking to ensure code quality.
# The workflow runs on all pull requests except when only markdown files are changed.

# 🚨 GITHUB SECRETS REQUIRED:
# - SUPABASE_ACCESS_TOKEN: Required for Supabase CLI to list and get branch details
# - RENDER_API_KEY: Required for fetching Render preview service IDs and triggering deploys
# - CORAL_BOT_TOKEN: Slack bot token passed to the send-slack-preview-notification workflow

name: "CI"
on:
  pull_request:
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DO_NOT_TRACK: 1
  FORCE_COLOR: 3
  SUPABASE_PROJECT_ID: ""
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_URL: ""
  SUPABASE_PUBLISHABLE_KEY: ""
  ADMIN_RENDER_APP_NAME: <RENDER_APP_NAME>
  USER_RENDER_APP_NAME: <RENDER_APP_NAME>

jobs:
  ci:
    name: "Format, lint, and typecheck"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code 🛒
        uses: actions/checkout@v5

      - name: Setup ⚙️
        uses: ./tooling/github/setup

      - name: Check formatting 💅
        run: pnpm format

      - name: Lint 🧹
        run: pnpm lint

      - name: Typecheck 🧪
        run: pnpm typecheck


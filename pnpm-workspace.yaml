packages:
  - apps/*
  - libs/*
  - tooling/*

catalog:
  "@dotenvx/dotenvx": ^2.19.1
  "@supabase/supabase-js": ^2.112.0
  "@t3-oss/env-core": ^0.13.11
  "@types/node": ^26.1.2
  "@xstate/store": ^4.2.2
  "@xstate/store-react": ^2.0.0
  dayjs: ^1.11.21
  eslint: ^9
  eslint-plugin-project-structure: ^3.14.3
  i18next: ^26.3.6
  jotai: ^2.20.2
  lodash: ^4.17.21
  prettier: ^3.9.6
  react-i18next: ^17.0.11
  tsx: ^4.23.5
  typescript: ^6.0.3
  zod: ^4.4.3

catalogs:
  casl:
    "@casl/ability": ^7.0.1
    "@casl/react": ^7.0.1
  hookform:
    "@hookform/resolvers": ^5.7.1
    react-hook-form: ^7.84.0
  react19:
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
    react: 19.2.3
    react-dom: 19.2.3
  sentry:
    "@sentry/node": ^10.11.0
    "@sentry/react": ^10.69.0
    "@sentry/react-native": ~8.21.0
    "@sentry/vite-plugin": ^5.4.0
  tanstack:
    "@tanstack/react-query": ^5.101.4
    "@tanstack/react-query-devtools": ^5.101.4
    "@tanstack/react-router": ^1.170.18
    "@tanstack/react-router-devtools": ^1.167.0
    "@tanstack/react-table": ^8.21.3
    "@tanstack/router-plugin": ^1.168.23
  ui:
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    input-otp: ^1.4.2

ignoredBuiltDependencies:
  - "@sentry/cli"

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - "@expo/*"
  - "expo"
  - "expo-*"
  - "nativewind"
  - "babel-preset-expo"
  - "eslint-config-expo"

onlyBuiltDependencies:
  - "@snaplet/seed"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - react-native-nitro-modules
